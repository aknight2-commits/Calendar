<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    .calendar-wrap {
      width: 100%;
      height: 1600px;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 1600px;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 900px) {
      .calendar-wrap,
      iframe {
        height: 1400px;
      }
    }

    @media (max-width: 600px) {
      .calendar-wrap,
      iframe {
        height: 1200px;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-wrap">
    <iframe
      src="https://calendar.google.com/calendar/embed?height=1600&amp;wkst=2&amp;ctz=Europe%2FLondon&amp;showPrint=0&amp;showTitle=0&amp;hl=en_GB&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0&amp;src=YWtuaWdodDJAc2hlZmZpZWxkLmFjLnVr&amp;src=ZGgxZzlxMDZ0MGQ5YWhpMTVuOTJqM2c5Y2NzOGhiN25AaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&amp;color=%23039be5&amp;color=%233f51b5"
      frameborder="0"
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
